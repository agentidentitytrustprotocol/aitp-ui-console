version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # ts-jest@29 peers on typescript <7; revisit once ts-jest supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint@10 removed context.getFilename(); eslint-plugin-react (bundled by
      # eslint-config-next) still calls it, so `eslint .` crashes. import and
      # jsx-a11y also peer on eslint <=9. Revisit once eslint-config-next supports 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      # One PR for minor+patch across the tree; majors held separately.
      minor-and-patch:
        update-types: ['minor', 'patch']
      major-updates:
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
