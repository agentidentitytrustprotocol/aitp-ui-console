version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # ts-jest@29 peers on typescript <7; revisit once ts-jest supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint@10 removed context.getFilename(); eslint-plugin-react (bundled by
      # eslint-config-next) still calls it, so `eslint .` crashes. import and
      # jsx-a11y also peer on eslint <=9. Revisit once eslint-config-next supports 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # @types/node tracks the Node RUNTIME, not the latest Node: engines is
      # >=22.13.0, CI and Vercel run 22. A major past 22 types APIs prod lacks
      # (#64 proposed 26). Raise it by hand with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The aitp SDK (an `npm:` alias) is bumped by bump-aitp.yml, which is
      # event-driven from aitp-rs and keeps the four platform packages locked.
      - dependency-name: '@agentidentitytrustprotocol/*'
      - dependency-name: aitp
    groups:
      # One PR for minor+patch across the tree; majors held separately.
      minor-and-patch:
        update-types: ['minor', 'patch']
      major-updates:
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
