name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm test -- --ci --coverage --coverageReporters=text-summary --coverageReporters=json-summary --coverageReporters=lcov

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`;
              console.log("## Unit test coverage\n");
              console.log("| Metric | Coverage | Covered/Total |");
              console.log("| --- | --- | --- |");
              for (const k of ["statements", "branches", "functions", "lines"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

      # Self-contained integration tests: exercise the real BFF proxy route
      # handlers against an in-process mock upstream. Suites that need the
      # real playground/CP services are gated behind RUN_INTEGRATION=1 and
      # skip themselves here.
      - name: Integration tests (self-contained)
        run: npm run test:integration -- --ci

      # Cache the Next.js incremental build cache so repeat builds are fast.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Build catches the things type/lint can't — missing Suspense
      # boundaries, prerender errors, bad RSC boundaries.
      - name: Build
        run: npm run build
        env:
          # Build only reads env at static-render time; the BFF proxy reads
          # at request time. These placeholders just keep `next build` happy.
          PLAYGROUND_URL: http://localhost:8000
          CP_URL: http://localhost:4000
